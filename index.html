<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phone Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C26; --ink:#14123A; --muted:#5B5A7E; --line:#DAD7EE; --soft:#F4F3F8;
  --violet:#7C3AED; --pink:#DB2777; --lime:#B6F24A;
  --grad:linear-gradient(135deg,#7C3AED,#DB2777);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.h-display{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
.eyebrow{margin:0;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}

.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:
    radial-gradient(900px 520px at 88% -8%,#4C2BD9 0%,rgba(76,43,217,0) 62%),
    radial-gradient(760px 520px at -10% 108%,#0E7490 0%,rgba(14,116,144,0) 58%),
    var(--bg)}

/* ---------- Brand screen ---------- */
.brand-screen{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,5vh,56px);padding:32px 16px}
.brand-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.brand-head .eyebrow{font-size:16px}
.brand-head h1{font-size:clamp(40px,6vw,68px)}
.carousel{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:1040px}
.round{flex:0 0 auto;border-radius:999px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.round svg{width:55%;height:55%}
.arrow{width:clamp(44px,7vw,76px);height:clamp(44px,7vw,76px)}
.brand-card{flex:1 1 auto;min-width:0;max-width:820px;height:clamp(280px,48vh,540px);border-radius:40px;border:none;background:#F7F7F7;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 40px 90px -30px rgba(124,58,237,.8);transition:transform .15s ease}
.brand-card:active{transform:scale(.98)}
.brand-card img{height:clamp(90px,20vh,220px);max-width:80%;width:auto;object-fit:contain}
.brand-name{font-size:clamp(28px,5vw,44px);line-height:1}
.brand-tag{font-size:clamp(16px,2.4vw,22px);color:var(--muted)}
.pill{margin-top:16px;padding:16px 32px;border-radius:999px;background:var(--grad);color:#fff;font-size:20px;font-weight:600}
.dots{display:flex;gap:4px;align-items:center}
.dot-btn{width:44px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.dot{display:block;height:12px;width:12px;border-radius:999px;background:rgba(255,255,255,.28);transition:width .2s,background .2s}
.dot.on{width:44px;background:var(--lime)}

/* ---------- Models screen ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid rgba(255,255,255,.12)}
.back{width:44px;height:44px}
.back svg{width:20px;height:20px}
.topbar .eyebrow{font-size:12px}
.topbar h1{font-size:24px}
.chips{flex:0 0 auto;display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.chip{flex:0 0 auto;height:44px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08)}
.chip.on{border-color:transparent;background:var(--grad)}
.scroll{flex:1 1 auto;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 44px -26px rgba(0,0,0,.7)}
.stage{height:190px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#F4F3F8}
.stage.flat{background:#F6F5F8}
.stage.drawn{background:#E9E6F5}
.stage img{width:100%;height:100%;object-fit:contain;padding:10px 0;mix-blend-mode:multiply}
.stage img.wide{padding:0 2px}
.stage.flat img{mix-blend-mode:normal}
.name-block{display:flex;flex-direction:column;gap:4px;min-height:68px}
.card h2{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:17px;line-height:1.2;font-weight:600;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.color-name{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.swatches{display:flex;flex-wrap:nowrap;margin-left:-4px;height:44px}
.sw{flex:0 0 auto;width:28px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.sw span{display:block;width:20px;height:20px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw.on span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--violet)}
.select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:15px;padding:0 12px;width:100%}
.spacer{height:68px}
.btn{height:48px;border-radius:12px;border:none;background:var(--grad);color:#fff;font-size:15px;font-weight:600}
.btn.lg{height:52px;border-radius:14px;font-size:16px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* drawn placeholders (colors without a photo) */
.d-phone{position:relative;width:64px;height:128px;border-radius:17px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 14px 24px -12px rgba(0,0,0,.45)}
.d-phone.wide{width:88px;height:108px}
.d-phone::before{content:"";position:absolute;inset:4px;border-radius:13px;background:#1B1D22}
.d-phone::after{content:"";position:absolute;top:9px;left:50%;width:18px;height:5px;margin-left:-9px;border-radius:4px;background:#000}
.d-laptop{position:relative;width:120px;height:76px}
.d-laptop .lid{position:absolute;left:10px;top:0;width:100px;height:66px;border-radius:7px 7px 0 0;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.d-laptop .lid::before{content:"";position:absolute;inset:5px;border-radius:3px;background:#1B1D22}
.d-laptop .base{position:absolute;left:0;top:66px;width:120px;height:8px;border-radius:0 0 12px 12px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.14),0 10px 18px -8px rgba(0,0,0,.45)}
.d-buds{display:flex;align-items:flex-start;gap:22px}
.d-buds .pod{display:flex;flex-direction:column;align-items:center}
.d-buds i{display:block;width:26px;height:26px;border-radius:999px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.d-buds b{display:block;width:9px;height:44px;margin-top:-6px;border-radius:0 0 6px 6px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.d-hp{position:relative;width:104px;height:100px}
.d-hp .band{position:absolute;left:14px;top:0;width:76px;height:70px;border-radius:40px 40px 0 0;border:8px solid var(--c);border-bottom:none}
.d-hp .cup{position:absolute;top:52px;width:26px;height:46px;border-radius:14px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.14),0 10px 16px -8px rgba(0,0,0,.45)}
.d-hp .cup.l{left:2px}.d-hp .cup.r{right:2px}

/* ---------- Delivery dialog ---------- */
.overlay{position:absolute;inset:0;z-index:10;background:rgba(6,7,28,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:100%;max-width:460px;max-height:100%;overflow-y:auto;background:#fff;color:var(--ink);border-radius:28px;padding:24px;
  display:flex;flex-direction:column;gap:18px;box-shadow:0 40px 90px -30px rgba(124,58,237,.7)}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dlg-head .eyebrow{font-size:12px;color:var(--violet)}
.dlg-head h2{font-size:26px}
.close{flex:0 0 auto;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.close svg{width:18px;height:18px}
.summary{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft)}
.summary .dotc{flex:0 0 auto;width:28px;height:28px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.summary .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.summary .t1{font-size:15px;font-weight:600}
.summary .t2{font-size:13px;color:var(--muted)}
.dialog .lbl{font-size:13px;color:#3A3860}
.input-wrap{position:relative}
.input{height:48px;border-radius:12px;border:1px solid var(--line);background:#F7F6FB;color:var(--ink);font-size:16px;padding:0 96px 0 14px;width:100%}
.paste{position:absolute;right:2px;top:2px;height:44px;padding:0 16px;border-radius:10px;border:none;background:#EDE7FF;color:#5B21B6;font-size:14px;font-weight:600}

/* ---------- Tracking screen ---------- */
.trk{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.trk-map{flex:1 1 0;min-height:280px;position:relative;overflow:hidden;background:#131750}
.trk-map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trk-panel{flex:0 0 auto;position:relative;z-index:2;margin-top:-24px;border-radius:28px 28px 0 0;background:#fff;color:var(--ink);
  padding:22px 20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.5)}
@media (min-width:900px){
  .trk{flex-direction:row-reverse}
  .trk-panel{flex:0 0 440px;margin-top:0;border-radius:0;overflow-y:auto}
}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#EDE7FF;color:#5B21B6;font-size:12px;font-weight:700;letter-spacing:.08em}
.badge i{width:8px;height:8px;border-radius:999px;background:var(--violet);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.t-head{display:flex;flex-direction:column;gap:6px}
.t-head h1{font-size:30px;line-height:1.1}
.t-head p{margin:0;font-size:15px;color:var(--muted)}
.eta-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.eta{font-size:40px}
.dist{font-size:14px;font-weight:600;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:#EDEBF6;overflow:hidden}
.bar-fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#7C3AED,#DB2777);transform-origin:left center;animation:fill 8s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mark{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff;border:2px solid var(--line)}
.mark svg{width:16px;height:16px}
.mark.done{background:var(--grad);border:none}
.mark.active{border:4px solid var(--violet)}
.step span{font-size:13px;font-weight:600;color:var(--ink)}
.step.todo span{color:var(--muted)}
.order-box{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--soft)}
.order-box .to{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.order-box .to .a{font-size:12px;font-weight:600;color:var(--muted)}
.order-box .to .b{font-size:14px;font-weight:500;overflow-wrap:anywhere}
</style>
</head>

    { id: 'zflip6', name: 'Galaxy Z Flip6', colors: [['Blue', '#AFC4DE'], ['Mint', '#C5E3D3'], ['Silver Shadow', '#C8C9CB'], ['Yellow', '#F3E6A0']], storage: ['256GB', '512GB'] },
    { id: 'a55', name: 'Galaxy A55', colors: [['Awesome Navy', '#2E3446'], ['Awesome Iceblue', '#C9DBE7'], ['Awesome Lilac', '#C9BEDF']], storage: ['128GB', '256GB'] }
  ] },
  { id: 'xiaomi', name: 'Xiaomi', logo: 'logo_xiaomi', tagline: 'Xiaomi, Redmi & POCO lineup', models: [
    { id: 'x14u', name: 'Xiaomi 14 Ultra', colors: [['Black', '#2A2A2C'], ['White', '#EEEDEA']], storage: ['256GB', '512GB', '1TB'] },
    { id: 'x14', name: 'Xiaomi 14', colors: [['Black', '#2A2A2C'], ['White', '#EEEDEA'], ['Jade Green', '#B9CDBE']], storage: ['256GB', '512GB'] },
    { id: 'rn13pp', name: 'Redmi Note 13 Pro+', colors: [['Midnight Black', '#232427'], ['Moonlight White', '#EDEBE6'], ['Aurora Purple', '#B8A7D6']], storage: ['256GB', '512GB'] },
    { id: 'pocox6p', name: 'POCO X6 Pro', colors: [['Black', '#2A2A2C'], ['Grey', '#9C9EA2'], ['Yellow', '#F0D24A']], storage: ['256GB', '512GB'] }
  ] }
];

const TRIP_SECONDS = 8;      // how long the truck drives
const TRIP_MINUTES = 8;      // ETA shown at the start
const TRIP_KM = 2.4;         // distance shown at the start

/* ---------- Random data for the Paste buttons ---------- */
const FIRST = ['James', 'Olivia', 'Liam', 'Emma', 'Noah', 'Sophia', 'Lucas', 'Mia', 'Ethan', 'Ava', 'Daniel', 'Chloe'];
const LAST = ['Carter', 'Brooks', 'Bennett', 'Morgan', 'Hayes', 'Foster', 'Reed', 'Collins', 'Parker', 'Murphy', 'Bailey', 'Cooper'];
const STREETS = ['Maple Street', 'Oak Avenue', 'Cedar Lane', 'Sunset Boulevard', 'Lakeview Drive', 'Park Road', 'Willow Way', 'Highland Avenue'];
const CITIES = ['Austin, TX', 'Denver, CO', 'Portland, OR', 'Seattle, WA', 'Miami, FL', 'Boston, MA', 'Chicago, IL', 'Phoenix, AZ'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const randomName = () => pick(FIRST) + ' ' + pick(LAST);
const randomAddress = () => (10 + Math.floor(Math.random() * 990)) + ' ' + pick(STREETS) + ', Apt ' + (1 + Math.floor(Math.random() * 60)) + ', ' + pick(CITIES);

/* ---------- Icons ---------- */
const svgIcon = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON = {
  left: svgIcon('M15 18l-6-6 6-6'),
  right: svgIcon('M9 18l6-6-6-6'),
  close: svgIcon('M18 6L6 18M6 6l12 12'),
  check: svgIcon('M20 6L9 17l-5-5', 3)
};

/* ---------- State ---------- */
const S = { screen: 'brand', brandIdx: 0, cat: 'All', picks: {}, selected: null, fullName: '', address: '', progress: 0 };
const app = document.getElementById('app');
let tripTimer = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brandIndex = () => ((S.brandIdx % BRANDS.length) + BRANDS.length) % BRANDS.length;
const brand = () => BRANDS[brandIndex()];
const findModel = (id) => brand().models.find((m) => m.id === id);
const pickOf = (m) => { const p = S.picks[m.id] || {}; return { color: p.color ?? 0, storage: p.storage ?? m.storage[0] }; };
const setPick = (m, patch) => { S.picks[m.id] = { ...pickOf(m), ...patch }; };
const formReady = () => S.fullName.trim() !== '' && S.address.trim() !== '';
const detailText = (sel) => sel.storage ? sel.color + ' · ' + sel.storage : sel.color;

/* ---------- Screens ---------- */
function viewBrand() {
  const b = brand(), i = brandIndex();
  return `
  <section class="brand-screen">
    <div class="brand-head">
      <p class="eyebrow">Step 1 of 3</p>
      <h1 class="h-display">Select a brand</h1>
    </div>
    <div class="carousel" id="carousel">
      <button class="round arrow" data-act="prev" aria-label="Previous brand">${ICON.left}</button>
      <button class="brand-card" data-act="open" aria-label="Browse ${esc(b.name)}">
        <img src="${IMG[b.logo]}" alt="">
        <span class="h-display brand-name">${esc(b.name)}</span>
        <span class="brand-tag">${esc(b.tagline)}</span>
        <span class="pill">Tap to browse</span>
      </button>
      <button class="round arrow" data-act="next" aria-label="Next brand">${ICON.right}</button>
    </div>
    <div class="dots">
      ${BRANDS.map((x, k) => `<button class="dot-btn" data-act="dot" data-i="${k}" aria-label="Show ${esc(x.name)}"><span class="dot${k === i ? ' on' : ''}"></span></button>`).join('')}
    </div>
  </section>`;
}

function drawn(m, kind) {
  if (kind === 'laptop') return '<div class="d-laptop"><div class="lid"></div><div class="base"></div></div>';
  if (kind === 'earbuds') return '<div class="d-buds"><div class="pod"><i></i><b></b></div><div class="pod"><i></i><b></b></div></div>';
  if (kind === 'headphones') return '<div class="d-hp"><div class="band"></div><div class="cup l"></div><div class="cup r"></div></div>';
  return `<div class="d-phone${m.wide ? ' wide' : ''}"></div>`;
}

function viewCard(m) {
  const kind = m.kind || 'phone';
  const p = pickOf(m);
  const c = m.colors[p.color];
  const photo = m.img && m.img[p.color];
  const stage = photo
    ? `<div class="stage${m.flat ? ' flat' : ''}"><img class="${(kind === 'laptop' || m.wide) ? 'wide' : ''}" src="${IMG[photo]}" alt="${esc(m.name)}, ${esc(c[0])}"></div>`
    : `<div class="stage drawn" style="--c:${c[1]}">${drawn(m, kind)}</div>`;
  const swatches = m.colors.map((col, i) =>
    `<button class="sw${i === p.color ? ' on' : ''}" data-act="color" data-m="${m.id}" data-i="${i}" aria-label="${esc(col[0])}" aria-pressed="${i === p.color}"><span style="background:${col[1]}"></span></button>`).join('');
  const storage = m.storage.length
    ? `<div class="field">
         <label class="lbl" for="st-${m.id}">Storage</label>
         <select class="select" id="st-${m.id}" data-storage="${m.id}">
           ${m.storage.map((o) => `<option value="${o}"${o === p.storage ? ' selected' : ''}>${o}</option>`).join('')}
         </select>
       </div>`
    : '<div class="spacer" aria-hidden="true"></div>';
  return `
  <article class="card">
    ${stage}
    <div class="name-block">
      <h2>${esc(m.name)}</h2>
      <p class="color-name">${esc(c[0])}</p>
    </div>
    <div class="field">
      <span class="lbl">Color</span>
      <div class="swatches">${swatches}</div>
    </div>
    ${storage}
    <button class="btn" data-act="choose" data-m="${m.id}">Select</button>
  </article>`;
}

function viewDetails() {
  const sel = S.selected;
  return `
  <div class="overlay" data-act="overlay">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dlg-head">
        <div>
          <p class="eyebrow">Step 3 of 3</p>
          <h2 class="h-display" id="dlg-title">Delivery details</h2>
        </div>
        <button class="close" data-act="close" aria-label="Close">${ICON.close}</button>
      </div>
      <div class="summary">
        <span class="dotc" style="background:${sel.hex}"></span>
        <div class="txt"><span class="t1">${esc(sel.name)}</span><span class="t2">${esc(detailText(sel))}</span></div>
      </div>
      <div class="field">
        <label class="lbl" for="f-name">Full name</label>
        <div class="input-wrap">
          <input class="input" id="f-name" data-field="fullName" type="text" autocomplete="name" placeholder="Jane Doe" value="${esc(S.fullName)}">
          <button type="button" class="paste" data-act="paste" data-f="fullName" aria-label="Paste a random full name">Paste</button>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="f-address">Delivery address</label>
        <div class="input-wrap">
          <input class="input" id="f-address" data-field="address" type="text" autocomplete="street-address" placeholder="Street, building, apartment, city" value="${esc(S.address)}">
          <button type="button" class="paste" data-act="paste" data-f="address" aria-label="Paste a random delivery address">Paste</button>
        </div>
      </div>
      <button class="btn lg" id="submit" data-act="submit"${formReady() ? '' : ' disabled'}>Submit order</button>
    </div>
  </div>`;
}

function viewModels() {
  const b = brand();
  const catList = [...new Set(b.models.map((m) => m.cat || 'Phones'))];
  const list = b.models.filter((m) => S.cat === 'All' || (m.cat || 'Phones') === S.cat);
  const chips = catList.length > 1
    ? `<div class="chips">${['All'].concat(catList).map((c) => `<button class="chip${c === S.cat ? ' on' : ''}" data-act="cat" data-c="${c}" aria-pressed="${c === S.cat}">${c}</button>`).join('')}</div>`
    : '';
  return `
  <header class="topbar">
    <button class="round back" data-act="back" aria-label="Back to brands">${ICON.left}</button>
    <div>
      <p class="eyebrow">Step 2 of 3</p>
      <h1 class="h-display">${esc(b.name)} models</h1>
    </div>
  </header>
  ${chips}
  <div class="scroll"><div class="grid">${list.map(viewCard).join('')}</div></div>
  ${S.screen === 'details' ? viewDetails() : ''}`;
}

/* --- Tracking map (SVG). The truck and the green trail are animated by the browser (SMIL),
       so they move smoothly; JS only updates the text once per second. --- */
const ROUTE = '40,390 40,280 150,280 150,170 260,170 260,60';
const ROUTE_PATH = 'M40,390 L40,280 L150,280 L150,170 L260,170 L260,60';
const ROUTE_LEN = 550;

function viewMap() {
  const blocks = [
    [64, 84, 0], [174, 84, 1], [284, 84, 0], [-46, 194, 0], [64, 194, 0], [174, 194, 0], [284, 194, 1],
    [64, 304, 1], [174, 304, 0], [284, 304, 0], [-46, -26, 0], [64, -26, 0], [174, -26, 0], [284, -26, 0]
  ].map(([x, y, park]) => `<rect x="${x}" y="${y}" width="74" height="74" rx="10" fill="${park ? '#14485F' : '#1B2070'}"/>`).join('');
  const roads = [40, 150, 260, 370].map((x) => `<line x1="${x}" y1="-700" x2="${x}" y2="1200"/>`).join('')
    + [60, 170, 280, 390].map((y) => `<line x1="-700" y1="${y}" x2="1100" y2="${y}"/>`).join('');
  return `
  <svg viewBox="0 0 400 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map showing the courier driving to your address">
    <rect x="-700" y="-700" width="1800" height="1900" fill="#131750"/>
    ${blocks}
    <g stroke="#2B3190" stroke-width="22" fill="none">${roads}</g>
    <g stroke="#5A63D6" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.55" fill="none">${roads}</g>

    <polyline points="${ROUTE}" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${ROUTE}" fill="none" stroke="#B6F24A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${ROUTE_LEN}" stroke-dashoffset="${ROUTE_LEN}">
      <animate attributeName="stroke-dashoffset" from="${ROUTE_LEN}" to="0" dur="${TRIP_SECONDS}s" fill="freeze"/>
    </polyline>

    <circle cx="40" cy="390" r="11" fill="#FFFFFF"/>
    <circle cx="40" cy="390" r="5" fill="#7C3AED"/>
    <text x="58" y="418" fill="#FFFFFF" font-size="12" font-weight="600" font-family="Inter, sans-serif">Store</text>

    <circle cx="260" cy="60" r="12" fill="#EC4899" opacity="0.5">
      <animate attributeName="r" values="12;34" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="60" r="12" fill="#EC4899" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="260" cy="60" r="4" fill="#FFFFFF"/>
    <text x="278" y="38" fill="#FFFFFF" font-size="12" font-weight="600" font-family="Inter, sans-serif">You</text>

    <g>
      <animateMotion path="${ROUTE_PATH}" dur="${TRIP_SECONDS}s" calcMode="paced" fill="freeze"/>
      <circle cx="0" cy="0" r="34" fill="#B6F24A" opacity="0.28">
        <animate attributeName="r" values="30;46;30" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.34;0.08;0.34" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <g transform="scale(1.3)">
        <ellipse cx="0" cy="19" rx="29" ry="3" fill="#000000" opacity="0.4"/>
        <rect x="-27" y="-16" width="33" height="25" rx="3" fill="#FFFFFF"/>
        <rect x="-27" y="-6" width="33" height="4" fill="#7C3AED"/>
        <rect x="-27" y="-1" width="33" height="2" fill="#DB2777"/>
        <polygon points="7,-10 18,-10 27,-1 27,9 7,9" fill="#B6F24A"/>
        <polygon points="10,-7.5 17,-7.5 23,-1.5 10,-1.5" fill="#1B1F5E"/>
        <rect x="-27" y="9" width="54" height="4" rx="1.5" fill="#14123A"/>
        <rect x="-28" y="-1" width="2" height="5" rx="1" fill="#FF4D4D"/>
        <rect x="25" y="2" width="3" height="4" rx="1" fill="#FFE27A"/>
        <circle cx="-15" cy="13" r="6.5" fill="#0A0C26" stroke="#FFFFFF" stroke-width="1"/>
        <circle cx="-15" cy="13" r="2.5" fill="#9CA3AF"/>
        <circle cx="17" cy="13" r="6.5" fill="#0A0C26" stroke="#FFFFFF" stroke-width="1"/>
        <circle cx="17" cy="13" r="2.5" fill="#9CA3AF"/>
      </g>
    </g>
  </svg>`;
}

function viewSteps() {
  const arrived = S.progress >= 1;
  const steps = [['Confirmed', 'done'], ['On the way', arrived ? 'done' : 'active'], ['Arrived', arrived ? 'done' : 'todo']];
  return steps.map(([label, st]) =>
    `<div class="step ${st}"><span class="mark ${st}">${st === 'done' ? ICON.check : ''}</span><span>${label}</span></div>`).join('');
}

function trackText() {
  const t = S.progress, arrived = t >= 1;
  return {
    badge: arrived ? 'DELIVERED' : 'LIVE',
    title: arrived ? 'Your order has arrived!' : 'Courier is on the way',
    eta: arrived ? 'Arrived' : Math.max(1, Math.ceil((1 - t) * TRIP_MINUTES)) + ' min',
    dist: arrived ? '0 km away' : ((1 - t) * TRIP_KM).toFixed(1) + ' km away'
  };
}

function viewTracking() {
  const sel = S.selected, tt = trackText();
  return `
  <section class="trk">
    <div class="trk-map">${viewMap()}</div>
    <div class="trk-panel">
      <div><span class="badge"><i></i><span id="t-badge">${tt.badge}</span></span></div>
      <div class="t-head">
        <h1 class="h-display" id="t-title">${tt.title}</h1>
        <p>Thank you for your order! We will contact you shortly to confirm.</p>
      </div>
      <div class="eta-row">
        <span class="h-display eta" id="t-eta">${tt.eta}</span>
        <span class="dist" id="t-dist">${tt.dist}</span>
      </div>
      <div class="bar"><div class="bar-fill" style="animation-duration:${TRIP_SECONDS}s"></div></div>
      <div class="steps" id="t-steps">${viewSteps()}</div>
      <div class="order-box">
        <div class="summary" style="padding:0;background:none">
          <span class="dotc" style="background:${sel.hex}"></span>
          <div class="txt"><span class="t1">${esc(sel.name)}</span><span class="t2">${esc(detailText(sel))}</span></div>
        </div>
        <div class="to">
          <span class="a">Delivering to ${esc(S.fullName)}</span>
          <span class="b">${esc(S.address)}</span>
        </div>
      </div>
      <button class="btn lg" data-act="restart">Order again</button>
    </div>
  </section>`;
}

/* ---------- Render ---------- */
function render() {
  const sc = app.querySelector('.scroll');
  const keepTop = sc && (S.screen === 'models' || S.screen === 'details') ? sc.scrollTop : 0;
  if (S.screen === 'brand') app.innerHTML = viewBrand();
  else if (S.screen === 'models' || S.screen === 'details') app.innerHTML = viewModels();
  else app.innerHTML = viewTracking();
  const sc2 = app.querySelector('.scroll');
  if (sc2 && keepTop) sc2.scrollTop = keepTop;
}

function updateTracking() {
  const tt = trackText();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('t-badge', tt.badge); set('t-title', tt.title); set('t-eta', tt.eta); set('t-dist', tt.dist);
  const steps = document.getElementById('t-steps');
  if (steps) steps.innerHTML = viewSteps();
}

function startTrip() {
  clearInterval(tripTimer);
  const step = 1 / TRIP_SECONDS;
  tripTimer = setInterval(() => {
    if (S.screen !== 'done') { clearInterval(tripTimer); return; }
    S.progress = Math.min(1, S.progress + step);
    updateTracking();
    if (S.progress >= 1) clearInterval(tripTimer);
  }, 1000);
}

/* ---------- Actions ---------- */
const ACT = {
  prev: () => { S.brandIdx--; render(); },
  next: () => { S.brandIdx++; render(); },
  dot: (el) => { S.brandIdx = +el.dataset.i; render(); },
  open: () => { S.screen = 'models'; S.cat = 'All'; render(); },
  back: () => { S.screen = 'brand'; render(); },
  cat: (el) => { S.cat = el.dataset.c; render(); },
  color: (el) => { setPick(findModel(el.dataset.m), { color: +el.dataset.i }); render(); },
  choose: (el) => {
    const m = findModel(el.dataset.m), p = pickOf(m), c = m.colors[p.color];
    S.selected = { name: m.name, color: c[0], hex: c[1], storage: p.storage };
    S.screen = 'details'; render();
  },
  close: () => { S.screen = 'models'; render(); },
  overlay: (el, e) => { if (e.target === el) ACT.close(); },
  paste: (el) => {
    const f = el.dataset.f;
    S[f] = f === 'fullName' ? randomName() : randomAddress();
    const input = app.querySelector(`[data-field="${f}"]`);
    if (input) input.value = S[f];
    syncSubmit();
  },
  submit: () => {
    if (!formReady()) return;
    S.screen = 'done'; S.progress = 0; render(); startTrip();
  },
  restart: () => {
    clearInterval(tripTimer);
    Object.assign(S, { screen: 'brand', picks: {}, selected: null, fullName: '', address: '', progress: 0 });
    render();
  }
};

function syncSubmit() {
  const b = document.getElementById('submit');
  if (b) b.disabled = !formReady();
}

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !app.contains(el)) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
app.addEventListener('input', (e) => {
  const f = e.target.dataset && e.target.dataset.field;
  if (f) { S[f] = e.target.value; syncSubmit(); }
});
app.addEventListener('change', (e) => {
  const id = e.target.dataset && e.target.dataset.storage;
  if (id) setPick(findModel(id), { storage: e.target.value });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.screen === 'details') ACT.close();
});

/* Swipe left/right on the brand screen */
let touchX = null;
app.addEventListener('touchstart', (e) => { touchX = S.screen === 'brand' ? e.touches[0].clientX : null; }, { passive: true });
app.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 60) { dx < 0 ? ACT.next() : ACT.prev(); }
}, { passive: true });

render();
</script>
</body>
</html>
